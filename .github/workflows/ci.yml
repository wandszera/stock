name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement backend/requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q backend/app backend/tests

      - name: Apply migrations on a fresh database
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci-migrations.db
        run: python -m alembic upgrade head

      - name: Run test suite
        run: python -m pytest -q

  postgres-concurrency:
    name: PostgreSQL concurrency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stock_test
          POSTGRES_USER: stock
          POSTGRES_PASSWORD: stock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stock -d stock_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement backend/requirements.txt

      - name: Run PostgreSQL concurrency tests
        env:
          TEST_POSTGRES_DATABASE_URL: postgresql+psycopg://stock:stock@localhost:5432/stock_test
        run: python -m pytest -q -m postgres

  frontend:
    name: Frontend syntax
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript modules
        run: npm run check

  container:
    name: Production container
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        working-directory: backend
        run: docker compose --env-file production.env.example -f compose.yaml config --quiet

      - name: Build application image
        run: docker build --tag stock-flow:ci .
