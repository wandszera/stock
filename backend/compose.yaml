# compose.yaml
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://app:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@db:5432/estoque
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:?Defina BACKEND_CORS_ORIGINS}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?Defina TRUSTED_HOSTS}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: estoque_db
    environment:
      POSTGRES_DB: estoque
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d estoque"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
